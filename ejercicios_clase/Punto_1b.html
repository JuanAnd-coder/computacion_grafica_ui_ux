<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto 1.b</title>
  <link rel="stylesheet" href="1b.css">
</head>
<body>
  <div class="contenedor">

    <!-- Barra superior -->
    <div class="barra-superior">
      <div class="boton ancho"></div>
      <div class="boton corto"></div>
      <div class="boton ancho"></div>
      <div class="boton corto"></div>
      <div class="boton corto"></div>
    </div>

    <!-- Cuerpo -->
    <div class="cuerpo">

      <!-- Tarjetas grises (grid 2x2) -->
      <div class="tarjetas">
        <div class="tarjeta"></div>
        <div class="tarjeta"></div>
        <div class="tarjeta"></div>
        <div class="tarjeta"></div>
      </div>

      <!-- Panel oscuro -->
      <div class="panel">

        <div class="perfil">
          <div class="marcas">
            <div class="marca rosa-claro"></div>
            <div class="marca rosa-medio"></div>
            <div class="marca rosa-oscuro"></div>
          </div>
          <div class="avatar"></div>
        </div>

        <!-- Ahora son 11 líneas (antes eran 9) -->
        <div class="lineas">
          <div class="linea rosa l1"></div>
          <div class="linea amarilla l2"></div>
          <div class="linea rosa l3"></div>
          <div class="linea rosa l4"></div>
          <div class="linea verde l5"></div>
          <div class="linea rosa l6"></div>
          <div class="linea rosa l7"></div>
          <div class="linea rosa l8"></div>
          <div class="linea rosa l9"></div>
          <div class="linea rosa l10"></div>
          <div class="linea rosa l11"></div>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
